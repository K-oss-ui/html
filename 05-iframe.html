<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Iframe | HTML </title>
</head>

<body>
    <h1>Iframe</h1>
    <hr>

    <h2>Para que serve</h2>
    <p>O inline Iframe é um elemento que nos permite embutir outro documento ou conteudo externo dentro da nossa pagina.
        É bastante usado para Youtube, Google Maps, e outros conteudos externos.</p>

    <iframe src="" frameborder="0"></iframe>

    <hr>
    <h3>Carregando o Youtube</h3>
    <iframe width="560" height="315" src="https://youtube.com/embed/q4GdJVvdxss?si=JFHxNuD8sBEigjsm"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen></iframe>

    <h3>Carregando mapas </h3>
    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3657.224544444444!2d-46.633307999999995!3d-23.550520000000002!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94c6a1bca6d8a8c7%3A0x8b7c8e8e8e8e8e8e!2sS%C3%A3o%20Paulo%2C%20SP!5e0!3m2!1sen!2sbr!4v1617797777777!5m2!1sen!2sbr"
        width="600" height="450" frameborder="0" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
</body>

</html>
