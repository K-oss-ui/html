<!-- DOCTYPE - serve para indicar para os navegadores qual a versão e qual o padrão de HTML está sendo utilizado -->
<!DOCTYPE html>

<!-- HTML - Elemento raiz. Tudo que pertecem ao documento HTMLfica dentro dele -->

<!-- LANG/languege (idioma) = Atributo responsavel pela linguagemdo conteúdo do site. Além disso, tem um impacto muito grande naacessibilidade e SEO   -->
<html lang="pt-br">


<head>

    <!-- Charset = essa configuração serve para indicar ao navegador qual padrão/codificação de caracteres usar. Isso permite, utilizar com acentos, caracteres especiais e emojis.  -->
    <meta charset="UTF-8">

    <!-- Viewport = A parte da tela do navegador que mostra o site de verdade. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- títle/título = representa o título que aparece na página -->
    <title> Olá Mundo </title>
</head>

<!-- body = representa o conteúdo visível da página -->
<body>
       Olá, Mundo. Este é o meu primeiro programa em HTML.
</body>

</html>
